# DigitalOcean App Platform spec.
#
# This is the no-domain, nothing-but-DigitalOcean path: App Platform assigns a starter domain on
# ondigitalocean.app and issues a real certificate for it, so the site is served over HTTPS from the
# first deploy. That matters more than convenience - getUserMedia only runs in a secure context, so
# without a certificate the camera never starts and the gesture half of the game does not exist.
#
# Deploy: DigitalOcean -> Apps -> Create App -> pick this repo. It reads this file.
# Nothing here contains a secret; the sensitive values are typed into the dashboard and stored
# encrypted, which is why they are declared SECRET with no value.
#
# Known trade-off, by DigitalOcean's own documentation: App Platform containers have no persistent
# storage and do not support volumes, and the local filesystem is "permanently lost after deployments
# and other container replacements". runs/ holds leaderboard.json, quota.json and the portraits, so all
# three reset on every deploy. For a persistent board, use Spaces Object Storage or the droplet setup
# in deploy/ instead.
# The name is what the DigitalOcean dashboard lists the app under. It is deliberately NOT the
# hostname: App Platform derives the starter subdomain from the name once, when the app is created,
# and then pins it - renaming an app leaves the old prefix in place and there is no way to regenerate
# it. This app was created as "dimension-strike", so it still answers on
#   https://dimension-strike-qsn3g.ondigitalocean.app
# and renaming it here changed only the dashboard. That is the desired behaviour: the link has already
# been shared, so it must not move. Changing the URL would mean creating a new app.
name: experimental
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    # A plain git source rather than the GitHub integration, for two reasons: it needs no OAuth
    # authorization, so the app can be created entirely from the CLI; and it has no deploy_on_push,
    # which is what you want here - App Platform has no persistent storage, so an automatic deploy on
    # every push would silently wipe the leaderboard and the portraits. Deploy deliberately instead:
    #   doctl apps create-deployment <app-id>
    git:
      repo_clone_url: https://github.com/Deadsec69/dimension-strike-surviva.git
      branch: main

    instance_size_slug: basic-xxs
    instance_count: 1          # the board is a JSON file guarded by an in-process lock; a second
                               # instance would have its own copy and its own lock

    http_port: 8080            # matches ENV PORT in the Dockerfile; serve.py binds 0.0.0.0 when PORT is set

    health_check:
      http_path: /api/health   # answers immediately: model discovery is backgrounded, never blocking

    envs:
      # !! Do not apply this file with `doctl apps update --spec .do/app.yaml`. That replaces the whole
      # !! spec, and the two SECRET entries below carry no value - so it would set both secrets to the
      # !! empty string. That is exactly how this app was first created, and it left the live site with
      # !! hasKey:false, refusing every visitor's free portrait. Use `bash deploy/do-apply.sh` instead:
      # !! it merges the real values in from .env (gitignored) and pipes the spec to doctl on stdin.
      #
      # They carry no value here because a value here would be a secret committed to git. A genuinely
      # blank GEMINI_API_KEY is still a supported runtime mode - runs score and the board records
      # them, portraits just stay empty - but it is not what you want in production.
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Required to clear the board. Generate with: openssl rand -hex 24
      # Unlock the control once at https://<app>.ondigitalocean.app/?admin=<value>
      - key: DS_ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET

      # Free portraits on your key per visitor, and the limits behind them.
      - key: DS_FREE_PORTRAITS
        scope: RUN_TIME
        value: "1"
      - key: DS_FP_PER_DAY
        scope: RUN_TIME
        value: "3"
      - key: DS_GLOBAL_PER_DAY
        scope: RUN_TIME
        value: "60"
      - key: DS_RUNS_PER_HOUR
        scope: RUN_TIME
        value: "30"
